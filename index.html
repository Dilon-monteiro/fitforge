const exerciseImages = new Map();
function exerciseVisual(name) {
  if (!exerciseImages.has(name)) {
    const type = exercisePoses[name];
    const frames = poses[type].map((pose, index) => {
      const canvas = document.createElement('canvas');
      canvas.width = 280;
      canvas.height = 240;
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2);
      ctx.fillStyle = '#0c1220';
      ctx.fillRect(0, 0, 140, 120);
      const points = coordinates => coordinates.split(' ').map(pair => pair.split(',').map(Number));
      function line(path, color, width) {
        ctx.beginPath();
        ctx.moveTo(...path[0]);
        path.slice(1).forEach(point => ctx.lineTo(...point));
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      }
      const [head, shoulder, hip, elbow, hand, knee, foot, backKnee, backFoot] = points(pose);
      const [x, y] = hand;
      line([[15, 108], [125, 108]], '#34445b', 1);
      (equipment[type] || '').split('|').filter(Boolean).forEach(path => line(points(path), '#74849a', 3));
      const cableAnchors = {pushdown:[63,18], pulldown:[76,16], row:[116,67], face:[119,43]};
      if (cableAnchors[type]) line([cableAnchors[type], hand], '#aab9cd', 1.5);
      if (backKnee) line([hip, backKnee, backFoot], '#6885a1', 5);
      line([shoulder, hip, knee, foot], '#dbe6f5', 6);
      line([shoulder, elbow, hand], '#b5f759', 5);
      ctx.beginPath();
      ctx.arc(...head, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#dbe6f5';
      ctx.fill();
      const hasWeight = ['bench','incline','press','lateral','supported','curl','goblet','hinge','squat'].includes(type);
      if (hasWeight) {
        const bar = ['Barbell Bench Press','Bench Press','Barbell Squat','Romanian Deadlift'].includes(name);
        const halfWidth = bar ? 14 : 7;
        line([[x-halfWidth,y],[x+halfWidth,y]], '#aab9cd', 3);
        for (const end of [x-halfWidth,x+halfWidth]) line([[end,y-4],[end,y+4]], '#aab9cd', 3);
      }
      if (['legCurl','extension'].includes(type)) line([[foot[0]+4,foot[1]-5],[foot[0]+8,foot[1]-5]], '#aab9cd', 5);
      const label = poses[type].length === 1 ? 'Hold' : ['Start','Finish'][index];
      return `<figure><img src="${canvas.toDataURL()}" alt="${safe(name)} diagram showing the ${label.toLowerCase()} position"><figcaption>${label}</figcaption></figure>`;
    });
    exerciseImages.set(name, `<div class="exercise-visual">${frames.join('')}</div>`);
  }
  return exerciseImages.get(name);
}
function workoutList(isLibrary=false){let arr=EX[category].filter(x=>!isLibrary||x[0].toLowerCase().includes(search.toLowerCase())||x[1].toLowerCase().includes(search.toLowerCase()));return arr.map((e,i)=>`<div class="exercise"><div class="details"><h3>${safe(e[0])}</h3><p>${safe(e[1])} · ${e[2]}</p>${(expanded===i||isLibrary)?`<div class="instructions">${safe(e[3])}${exerciseVisual(e[0])}</div>`:''}</div><button class="secondary" data-expand="${i}">${expanded===i?'Less':'How to'}</button></div>`).join('')||'<p class="empty">No matching exercises.</p>'}function bindWorkout(){document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;expanded=-1;render()});document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{expanded=expanded===+b.dataset.expand?-1:+b.dataset.expand;render()})}function dashboard(){let last=db.body.at(-1),todayMeals=db.meals.filter(m=>m.date===today()),k=todayMeals.reduce((a,m)=>a+m.kcal,0),sessions=db.logs.filter(l=>l.date===today()).length;return `<div class="cards"><div class="card"><div class="muted small">Today's calories</div><div class="stat">${fmt(k)} <span class="small muted">kcal</span></div><div class="progress"><div style="width:${Math.min(100,k/db.target*100)}%"></div></div></div><div class="card"><div class="muted small">Latest body weight</div><div class="stat">${last?last.weight:'—'} <span class="small muted">kg</span></div><div class="small muted">${last?last.date:'Add a measurement'}</div></div><div class="card"><div class="muted small">Exercises logged today</div><div class="stat">${sessions}</div><div class="small muted">Keep showing up</div></div></div><div class="split"><section class="panel"><div class="eyebrow">YOUR NEXT SESSION</div><h2>${safe(db.workout)} day</h2><p class="muted">Choose a training split and log every set.</p>${tabs()}<button class="primary" id="startWorkout">Open workout →</button></section><section class="panel"><div class="eyebrow">QUICK ACCESS</div><h2>Stay consistent</h2><p class="muted">Log a meal, record your weight or explore exercises.</p><div class="tabs"><button class="secondary" data-go="nutrition">+ Log food</button><button class="secondary" data-go="body">+ Weight</button><button class="secondary" data-go="library">Exercise library</button></div></section></div>`}function workouts(){return `<div class="sectionhead"><h2>Choose your training split</h2><span class="tag">6 workout types</span></div>${tabs()}<div class="split"><div class="panel"><h2>${category} day plan</h2><p class="muted small">Suggested sets and reps; adjust for your level and recovery.</p>${workoutList()}</div><div class="panel"><h2>Log a set</h2><p class="muted small">Track every set, weight and reps.</p><form id="setForm"><label class="field">Exercise<select name="exercise">${EX[category].map(e=>`<option>${safe(e[0])}</option>`).join('')}</select></label><div class="formgrid" style="margin:12px 0"><label class="field">Weight (kg)<input name="weight" type="number" min="0" step="0.5" value="20" required></label><label class="field">Reps<input name="reps" type="number" min="1" max="1000" value="10" required></label><label class="field">Sets<input name="sets" type="number" min="1" max="50" value="1" required></label></div><button class="primary" type="submit">+ Save set</button></form><div class="sectionhead"><h2>Recent sets</h2></div><div id="setHistory">${db.logs.slice(-8).reverse().map(l=>`<div class="foodrow"><div><b>${safe(l.exercise)}</b><div class="small muted">${l.date} · ${l.sets} set(s)</div></div><span class="tag">${l.weight} kg × ${l.reps}</span></div>`).join('')||'<p class="muted small">No sets recorded yet.</p>'}</div></div></div>`}function library(){return `<div class="sectionhead"><h2>Exercise encyclopedia</h2><span class="tag">${Object.values(EX).flat().length} planned movements</span></div><label class="field">Search by exercise or muscle<input id="searchExercise" placeholder="Search bench press, biceps, quads..." value="${safe(search)}"></label>${tabs()}<div class="panel">${workoutList(true)}</div><p class="muted small">Some exercises appear in multiple workout splits. Add your gym's machines and movements later.</p>`}function nutrition(){let meals=db.meals.filter(m=>m.date===today()),tot=[0,0,0,0];meals.forEach(m=>{tot[0]+=m.kcal;tot[1]+=m.p;tot[2]+=m.c;tot[3]+=m.f});return `<div class="cards"><div class="card"><div class="muted small">Consumed</div><div class="stat">${fmt(tot[0])}</div><div class="small muted">kcal today</div></div><div class="card"><div class="muted small">Remaining</div><div class="stat">${fmt(db.target-tot[0])}</div><div class="small muted">kcal</div></div><div class="card"><div class="muted small">Protein</div><div class="stat">${fmt(tot[1])}<span class="small muted"> g</span></div><div class="small muted">Carbs ${fmt(tot[2])}g · Fat ${fmt(tot[3])}g</div></div></div><div class="split"><div class="panel"><h2>Food diary</h2><p class="muted small">Values are illustrative estimates per 100g; recipes and brands vary.</p><form id="mealForm"><label class="field">Food<select id="foodChoice" name="food">${FOODS.map((f,i)=>`<option value="${i}">${safe(f[0])}</option>`).join('')}</select></label><div class="formrow" style="margin:12px 0"><label class="field">Quantity (g or ml)<input name="grams" type="number" min="1" max="10000" value="150" required></label><label class="field">Meal<select name="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></label></div><div id="foodPreview" class="tag" style="display:inline-block;margin-bottom:12px"></div><br><button class="primary">+ Add food</button></form><div class="sectionhead"><h2>Today's meals</h2></div>${meals.map(m=>`<div class="foodrow"><div><b>${safe(m.food)}</b><div class="small muted">${safe(m.meal)} · ${m.grams} g · P ${m.p.toFixed(1)}g / C ${m.c.toFixed(1)}g / F ${m.f.toFixed(1)}g</div></div><div><b>${fmt(m.kcal)} kcal</b> <button class="secondary" data-remove-meal="${m.id}" aria-label="Remove meal">×</button></div></div>`).join('')||'<p class="empty">No food logged today.</p>'}</div><div class="panel"><h2>Daily target</h2><p class="muted small">Set your personal calorie goal.</p><form id="targetForm" class="formrow"><label class="field">Target (kcal)<input name="target" type="number" min="500" max="10000" value="${db.target}" required></label><button class="secondary">Save</button></form><div class="sectionhead"><h2>Calorie density</h2></div><p class="muted small">Calories per 100 g help compare foods independent of serving size.</p>${FOODS.slice(0,7).map(f=>`<div class="foodrow"><span>${safe(f[0])}</span><b>${f[1]} kcal/100g</b></div>`).join('')}</div></div>`}function chartSvg(){let arr=db.body.slice(-12),vals=arr.map(x=>Number(x.weight));if(!vals.length)return '<p class="empty">Log your first measurement to see progress.</p>';let mn=Math.min(...vals)-1,mx=Math.max(...vals)+1,points=vals.map((v,i)=>`${35+(i/Math.max(1,vals.length-1))*490},${155-(v-mn)/(mx-mn)*120}`).join(' ');return `<svg class="chart" viewBox="0 0 550 180" role="img" aria-label="Body weight trend"><line x1="35" y1="155" x2="525" y2="155" stroke="#41516a"/><line x1="35" y1="35" x2="525" y2="35" stroke="#283a51" stroke-dasharray="4"/><polyline fill="none" stroke="#b6f34a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points="${points}"/>${vals.map((v,i)=>`<circle cx="${35+(i/Math.max(1,vals.length-1))*490}" cy="${155-(v-mn)/(mx-mn)*120}" r="5" fill="#b6f34a"/>`).join('')}<text x="35" y="22">${mx.toFixed(1)} kg</text><text x="35" y="174">${mn.toFixed(1)} kg</text></svg>`}function body(){let last=db.body.at(-1);return `<div class="cards"><div class="card"><div class="muted small">Current weight</div><div class="stat">${last?last.weight:'—'} <span class="small muted">kg</span></div></div><div class="card"><div class="muted small">BMI (screening metric)</div><div class="stat">${last&&last.height?(last.weight/(last.height/100)**2).toFixed(1):'—'}</div></div><div class="card"><div class="muted small">Measurements</div><div class="stat">${db.body.length}</div></div></div><div class="split"><section class="panel"><h2>Weight trend</h2>${chartSvg()}<h2>Measurement history</h2>${db.body.slice(-8).reverse().map(x=>`<div class="foodrow"><div><b>${x.weight} kg</b><div class="muted small">${x.date} · Height ${x.height||'—'} cm</div></div><span class="tag">Waist ${x.waist||'—'} cm</span></div>`).join('')||'<p class="muted">Nothing recorded yet.</p>'}</section><section class="panel"><h2>Add body measurements</h2><p class="muted small">Save regularly to see trends.</p><form id="bodyForm"><div class="formgrid"><label class="field">Weight kg<input name="weight" type="number" min="1" step="0.1" required></label><label class="field">Height cm<input name="height" type="number" min="50" step="0.1" value="${last?.height||175}"></label><label class="field">Waist cm<input name="waist" type="number" min="1" step="0.1"></label><label class="field">Chest cm<input name="chest" type="number" min="1" step="0.1"></label><label class="field">Arm cm<input name="arm" type="number" min="1" step="0.1"></label><label class="field">Hip cm<input name="hip" type="number" min="1" step="0.1"></label></div><button class="primary" style="margin-top:14px">+ Save measurement</button></form><div class="sectionhead"><h2>Backup your data</h2></div><p class="muted small">Data is stored only in this browser. Export a JSON backup before changing devices or clearing browser data.</p><button class="secondary" id="export">↓ Export JSON</button> <label class="secondary" style="display:inline-block;cursor:pointer">↑ Import JSON<input type="file" id="import" accept="application/json" hidden></label></section></div>`}function render(){navRender();$('#pageTitle').textContent=({dashboard:'Your fitness command center',workouts:'Build your strength',library:'Find your next exercise',nutrition:'Fuel your progress',body:'Every rep adds up'})[page];$('#view').innerHTML=({dashboard,workouts,library,nutrition,body})[page]();bindWorkout();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});if($('#startWorkout'))$('#startWorkout').onclick=()=>{db.workout=category;save();page='workouts';render()};if($('#setForm'))$('#setForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.logs.push({date:today(),exercise:f.get('exercise'),weight:+f.get('weight'),reps:+f.get('reps'),sets:+f.get('sets')});db.workout=category;save();toast('Set saved!');render()};if($('#searchExercise'))$('#searchExercise').oninput=e=>{search=e.target.value;let caret=e.target.selectionStart;render();$('#searchExercise').focus();$('#searchExercise').setSelectionRange(caret,caret)};if($('#mealForm')){let f=$('#mealForm'),preview=()=>{let x=FOODS[+f.elements.food.value],g=+f.elements.grams.value;$('#foodPreview').textContent=`${fmt(x[1]*g/100)} kcal · P ${(x[2]*g/100).toFixed(1)}g · C ${(x[3]*g/100).toFixed(1)}g · F ${(x[4]*g/100).toFixed(1)}g`};f.oninput=preview;preview();f.onsubmit=e=>{e.preventDefault();let d=new FormData(f),x=FOODS[+d.get('food')],g=+d.get('grams');db.meals.push({id:Date.now(),date:today(),food:x[0],grams:g,meal:d.get('meal'),kcal:x[1]*g/100,p:x[2]*g/100,c:x[3]*g/100,f:x[4]*g/100});save();toast('Food logged!');render()}}document.querySelectorAll('[data-remove-meal]').forEach(b=>b.onclick=()=>{db.meals=db.meals.filter(x=>x.id!==+b.dataset.removeMeal);save();render()});if($('#targetForm'))$('#targetForm').onsubmit=e=>{e.preventDefault();db.target=+e.target.elements.target.value;save();toast('Target updated');render()};if($('#bodyForm'))$('#bodyForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),o={date:today()};for(let k of ['weight','height','waist','chest','arm','hip'])o[k]=d.get(k)?+d.get(k):null;db.body.push(o);save();toast('Measurement saved');render()};if($('#export'))$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fitforge-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if($('#import'))$('#import').onchange=async e=>{try{let o=JSON.parse(await e.target.files[0].text());if(!Array.isArray(o.logs)||!Array.isArray(o.meals)||!Array.isArray(o.body))throw Error('Invalid backup');if(!confirm('Replace current data with imported backup?'))return;db={...init,...o};save();render();toast('Backup imported')}catch{toast('Invalid backup file')}}}render();let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installBtn').hidden=false});$('#installBtn').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#installBtn').hidden=true}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
